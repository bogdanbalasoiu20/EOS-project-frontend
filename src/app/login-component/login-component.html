<div class="auth-wrapper">
  <div class="auth-card">
    
    <div class="auth-brand">
      <div class="brand-icon">
        <i class="bi bi-shield-lock-fill"></i>
      </div>
    </div>

    <div class="auth-tabs">
      <button 
        type="button"
        class="tab-btn" 
        [class.active]="isLogin" 
        (click)="isLogin = true">
        Login
      </button>
      <button 
        type="button"
        class="tab-btn" 
        [class.active]="!isLogin" 
        (click)="isLogin = false">
        Register
      </button>
    </div>

    <div *ngIf="isLogin" class="auth-form">
      <h2>Welcome Back</h2>
      <p class="auth-subtitle">Enter your credentials to sign in to your account.</p>

      <div class="form-group">
        <label class="form-label">Email Address</label>
        <div class="input-icon-wrapper">
          <i class="bi bi-envelope input-icon"></i>
          <input
            type="email"
            class="form-control"
            placeholder="name@example.com"
            [(ngModel)]="loginData.email">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <div class="input-icon-wrapper">
          <i class="bi bi-lock input-icon"></i>
          <input
            [type]="showPassword ? 'text' : 'password'"
            class="form-control password-input"
            placeholder="••••••••"
            [(ngModel)]="loginData.password">
          <button 
            type="button" 
            class="password-toggle-btn"
            (click)="togglePasswordVisibility()"
            [title]="showPassword ? 'Hide password' : 'Show password'">
            <i class="bi" [ngClass]="showPassword ? 'bi-eye-slash' : 'bi-eye'"></i>
          </button>
        </div>
      </div>

      <button type="button" class="btn btn-primary btn-block" (click)="login()">
        <span>Sign In</span>
        <i class="bi bi-arrow-right ms-2"></i>
      </button>
    </div>

    <div *ngIf="!isLogin" class="auth-form">
      <h2>Create Account</h2>
      <p class="auth-subtitle">Fill in the details below to register a new account.</p>

      <div class="form-group">
        <label class="form-label">Username</label>
        <div class="input-icon-wrapper">
          <i class="bi bi-person input-icon"></i>
          <input
            type="text"
            class="form-control"
            placeholder="username"
            [(ngModel)]="registerData.username">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Email Address</label>
        <div class="input-icon-wrapper">
          <i class="bi bi-envelope input-icon"></i>
          <input
            type="email"
            class="form-control"
            placeholder="name@example.com"
            [(ngModel)]="registerData.email">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <div class="input-icon-wrapper">
          <i class="bi bi-lock input-icon"></i>
          <input
            [type]="showPassword ? 'text' : 'password'"
            class="form-control password-input"
            placeholder="••••••••"
            [(ngModel)]="registerData.password">
          <button 
            type="button" 
            class="password-toggle-btn"
            (click)="togglePasswordVisibility()"
            [title]="showPassword ? 'Hide password' : 'Show password'">
            <i class="bi" [ngClass]="showPassword ? 'bi-eye-slash' : 'bi-eye'"></i>
          </button>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Birth Date</label>
        <div class="input-icon-wrapper">
          <i class="bi bi-calendar3 input-icon"></i>
          <input
            type="date"
            class="form-control"
            [(ngModel)]="registerData.birthDate">
        </div>
      </div>

      <button type="button" class="btn btn-primary btn-block" (click)="register()">
        <span>Create Account</span>
        <i class="bi bi-check-lg ms-2"></i>
      </button>
    </div>

    <div *ngIf="message" class="auth-message">
      <i class="bi bi-exclamation-circle me-2"></i>
      <span>{{ message }}</span>
    </div>

  </div>
</div>
